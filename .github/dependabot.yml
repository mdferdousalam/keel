version: 2
updates:
  # Actions are pinned to commit SHAs, so Dependabot is how those pins get
  # reviewed and advanced rather than left to rot.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Grouped so routine patch bumps arrive as one reviewable pull request, while
    # anything touching the cryptographic dependencies stays separate and gets
    # read properly.
    groups:
      cargo-patch:
        update-types: ["patch"]
        exclude-patterns:
          - "argon2"
          - "chacha20poly1305"
          - "hkdf"
          - "sha2"
          - "blake3"
          - "zeroize"
          - "subtle"
          - "secrecy"
          - "getrandom"
    open-pull-requests-limit: 5

  # `fuzz/` is its own workspace with its own lockfile — deliberately, because fuzzing needs
  # nightly and a sanitizer — so `directory: "/"` above never saw it and its dependencies
  # have never been updated by anything. The fuzz targets are the code that parses hostile
  # input on purpose, which makes an unpatched dependency there worth as much attention as
  # one in the vault core.
  #
  # `apps/desktop/src-tauri` needs no entry: despite `apps/desktop` appearing in the
  # workspace `exclude` list, `src-tauri` is itself a member and shares the root lockfile.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    groups:
      fuzz:
        patterns: ["*"]
    open-pull-requests-limit: 3
