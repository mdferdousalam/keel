name: Deep checks

# Slower analysis that does not belong on every pull request. Undefined behaviour, semver
# breakage in the published libraries, and mutation testing.

on:
  schedule:
    - cron: "13 2 * * 3"
  pull_request:
    # On PRs only when the code these checks actually reason about changes.
    paths:
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/deep-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Undefined behaviour.
  #
  # This project confines `unsafe` to bitting-hardening, which is the one crate Miri cannot
  # run: it makes real syscalls (mlock, ptrace, core-dump limits) and Miri has no host FFI.
  # What Miri *can* check is the code that parses hostile bytes and handles key material —
  # out-of-bounds reads, invalid transmutes, aliasing violations in the buffer handling that
  # the fuzzers exercise for crashes but not for UB.
  # ---------------------------------------------------------------------------
  miri:
    name: Miri (${{ matrix.crate }})
    runs-on: ubuntu-latest
    continue-on-error: true
    # Miri interprets every instruction, so anything unbounded here runs for hours. The first
    # version of this job had no limit and was still going after 27 minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Only crates that compute rather than call the operating system.
        #
        # bitting-store was in this list on the first run and cannot be: it failed with
        # "unsupported operation: syscall: unsupported syscall number 326", which is
        # copy_file_range — what std::fs::copy uses on Linux, reached through the backup
        # rotation in the atomic write path. That is a Miri limitation, not a finding.
        # -Zmiri-disable-isolation does not help; it permits the operations Miri implements
        # and does not teach it new syscalls.
        #
        # bitting-crypto is excluded for a different reason: Argon2id at real parameters
        # under Miri is somewhere between hours and never.
        #
        # What remains is the code that parses hostile bytes, which is the code where a
        # provenance or aliasing bug would actually matter.
        crate: [bitting-format, bitting-proto]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Note for anyone reproducing this locally on an Apple Silicon Mac: it will not work.
      # Miri aborts with "can't call foreign function `llvm.aarch64.neon.tbl1.v16i8` on OS
      # `macos`" — BLAKE3's NEON backend, which Miri cannot execute. The x86_64 Linux runner
      # takes BLAKE3's other path and gets through. Use a Linux box or this job.
      - name: Run the test suite under Miri
        env:
          # Strict provenance and stacked borrows, with isolation off.
          #
          # Isolation was tried and does not survive proptest: the property tests abort with
          # "getcwd not available when isolation is enabled", because proptest resolves the
          # path for its regression file. PROPTEST_DISABLE_FAILURE_PERSISTENCE=1 was the
          # narrower fix and did not stop the getcwd call, so the choice is between
          # -Zmiri-disable-isolation and no Miri coverage of this crate at all.
          #
          # Taking the former, because the two controls are not worth the same. Miri is here
          # to find undefined behaviour — provenance, aliasing, out-of-bounds — in the code
          # that parses hostile bytes. Isolation only audits syscalls, which cargo-deny and
          # `cargo xtask check-network` already constrain from a different direction. Trading
          # the lesser control for coverage of the vault parser is the right way round.
          #
          # It is left switched off explicitly rather than quietly, so that anyone tightening
          # this later knows it was a decision and what it cost.
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
          # Still set: it stops a Miri-only counterexample being written into
          # proptest-regressions/ and committed as though it reproduced natively.
          PROPTEST_DISABLE_FAILURE_PERSISTENCE: "1"
          # proptest's default is 256 cases per property. Under Miri that is not a thorough
          # search, it is a job that does not finish — the first run of this workflow was
          # still going after 27 minutes.
          #
          # Sixteen is the right number because Miri is not looking for a counterexample. It
          # is looking for undefined behaviour, and UB in a parser shows up on the first
          # input that reaches the bad path, not the two-hundredth. The full 256 cases still
          # run in the normal test job, natively, where they cost seconds.
          PROPTEST_CASES: "16"
        run: cargo +nightly miri test -p ${{ matrix.crate }}

  # ---------------------------------------------------------------------------
  # API compatibility for the two crates other people are meant to depend on.
  #
  # bitting-proto (Apache-2.0) and bitting-client (MPL-2.0) are published as libraries, so a
  # silent breaking change in either is a broken build for a downstream user who followed
  # semver and expected not to care.
  # ---------------------------------------------------------------------------
  semver:
    name: Semver (${{ matrix.crate }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        crate: [bitting-proto, bitting-client]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Is there a published baseline to compare against?
        id: baseline
        run: |
          set -euo pipefail
          # cargo-semver-checks diffs against the newest version on crates.io. Nothing is
          # published yet, so until the first release this job has nothing to compare and
          # would fail for a reason that is not a defect. Check rather than assume.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'bitting-ci' "https://crates.io/api/v1/crates/${{ matrix.crate }}")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.crate }} is not on crates.io yet; no baseline to diff."
          fi

      - if: steps.baseline.outputs.published == 'true'
        run: cargo install cargo-semver-checks --locked
      - if: steps.baseline.outputs.published == 'true'
        run: cargo semver-checks check-release -p ${{ matrix.crate }}

  # ---------------------------------------------------------------------------
  # Mutation testing: break the code deliberately and see whether the tests notice.
  #
  # Scoped to the crypto and format crates. A surviving mutant there means a test asserts
  # something weaker than it appears to — which, for a vault parser, is the difference
  # between a test suite and the appearance of one.
  # ---------------------------------------------------------------------------
  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Scheduled only. A full mutant run is far too slow for a pull request.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install cargo-mutants --locked
      - name: Hunt for surviving mutants
        run: |
          # --in-place keeps one build directory rather than copying the tree per mutant.
          # The timeout multiplier accommodates the KDF calibration probe, which is slow by
          # design and would otherwise look like a hang.
          cargo mutants --in-place --timeout-multiplier 3 \
            --package bitting-format --package bitting-crypto \
            || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
          if-no-files-found: warn
