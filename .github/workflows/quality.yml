name: Quality

# Checks that are cheap, fast, and not about Rust semantics.
#
# Every tool here is installed as a pinned binary or from crates.io rather than through a
# third-party action. That follows the reasoning already recorded in audit.yml for
# cargo-deny: an action is another repository whose contents can change, running with access
# to this one. A downloaded tarball verified against the publisher's own checksums file is a
# smaller surface, and the workflows in this repository publish signed releases.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Renovate/dependabot will not see these, so they are listed together for review.
  ACTIONLINT_VERSION: "1.7.12"
  ZIZMOR_VERSION: "1.20.0"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # ---------------------------------------------------------------------------
  # actionlint. Blocking: it is deterministic, it is currently clean, and these files sign
  # and publish releases, so a syntax or shell error here is a supply-chain error.
  # ---------------------------------------------------------------------------
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          # Saved under the asset's own name, not a convenient short one: `sha256sum -c`
          # opens the path written in the manifest, so downloading to actionlint.tar.gz makes
          # it look for a file that does not exist and fail with "FAILED open or read" —
          # which reads like a checksum mismatch and is not one.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "${base}/${archive}"
          curl -fsSL -o actionlint_checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}\$" actionlint_checksums.txt | sha256sum -c -
          tar xzf "$archive" actionlint
          # Also runs shellcheck over every `run:` block, which is most of the value: the
          # release workflow is largely shell.
          ./actionlint -color

  # ---------------------------------------------------------------------------
  # zizmor. Advisory, at `--min-severity=medium`.
  #
  # Its first run reported 25 medium `artipacked` findings — `actions/checkout` leaving the
  # git credential in the workspace, where a later step or an uploaded artifact could carry
  # it out. Those were real, and all 23 outstanding checkouts have since been given
  # `persist-credentials: false`, which is why this landed with the backlog already cleared
  # rather than red on arrival.
  #
  # What remains below medium is left alone deliberately: almost all of it is
  # `superfluous-actions` arguing that `dtolnay/rust-toolchain` should be a hand-written
  # rustup script. That is a style preference, and replacing a widely reviewed pinned action
  # with bespoke shell is not obviously the safer direction.
  #
  # Still advisory rather than blocking because zizmor's rule set grows: a new audit landing
  # upstream should start a conversation, not a red main branch.
  # ---------------------------------------------------------------------------
  workflow-audit:
    name: Workflow security audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        run: |
          set -euo pipefail
          pipx install "zizmor==${ZIZMOR_VERSION}"
          # Audits for Actions-specific security problems actionlint does not model:
          # template-injectable interpolation in run blocks, over-broad permissions,
          # unpinned actions, and self-hosted-runner takeover patterns.
          # (Writing the interpolation syntax literally here is not possible — the runner
          # would evaluate it, which is itself the class of bug zizmor looks for.)
          zizmor --pedantic --min-severity=medium --format plain .github/workflows/

  # ---------------------------------------------------------------------------
  # Secret scanning. GitGuardian already runs on pull requests and GitHub's own secret
  # scanning is enabled for public repositories, so this is a third overlapping scanner.
  # Kept because the three have different rule sets and a leaked vault key is the one
  # mistake this project cannot walk back.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a secret committed and then removed is still a leaked secret, and
          # only shows up if the whole history is scanned.
          fetch-depth: 0

      - name: gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Same reason as the actionlint step: the manifest names the file, so the download
          # has to keep that name or `sha256sum -c` cannot find it.
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "${base}/${archive}"
          curl -fsSL -o gitleaks_checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" gitleaks_checksums.txt | sha256sum -c -
          tar xzf "$archive" gitleaks
          # The binary, not gitleaks-action: the action requires a paid licence key for
          # organisations, and the binary is the same scanner with no such condition.
          ./gitleaks detect --source . --redact --verbose --no-banner

  # ---------------------------------------------------------------------------
  # Spelling. Blocking, because the allowlist in `_typos.toml` was tuned against the actual
  # findings first and the tree is clean — a deterministic check that passes today can be a
  # gate today.
  #
  # The exclusions matter more than the check. `crates/bitting-crypto/data/` is skipped
  # because it holds a common-password blocklist and the EFF diceware list: the checker
  # flagged `tigger` there, which is a real and very common password and exactly the entry
  # that must not be "corrected". A spell fix in that file would weaken the strength check
  # and nothing would fail.
  # ---------------------------------------------------------------------------
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo install typos-cli --locked
      - run: typos
