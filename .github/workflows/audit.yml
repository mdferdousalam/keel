name: Security audit

# Advisories appear between pull requests, so this runs on a schedule as well as
# when the dependency set changes. Without the cron, a vulnerability disclosed
# against a dependency would sit unnoticed until someone happened to push.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed so a scheduled run can file an issue rather than failing silently
      # into a log nobody reads.
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny (all checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@30f817c6f72275c6d54dc744fbca09ebc958599f # v2.0.16
        with:
          command: check advisories bans licenses sources

  # Unused dependencies are not just clutter here: every crate in the tree is code
  # that can run inside the process holding an unlocked vault, so removing one is a
  # real reduction in attack surface.
  unused:
    name: Unused dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb2c1747b47c1c752e7d1a # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly udeps --workspace --all-targets
