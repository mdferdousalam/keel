name: Security audit

# Advisories appear between pull requests, so this runs on a schedule as well as
# when the dependency set changes. Without the cron, a vulnerability disclosed
# against a dependency would sit unnoticed until someone happened to push.
on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed so a scheduled run can file an issue rather than failing silently
      # into a log nobody reads.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # `rustsec/audit-check` builds cargo-audit from source inside the action, and that build
      # failed here. Installing it as a normal dependency puts the failure — if there is one —
      # in a step whose log is about installing a tool, rather than inside an action where it
      # reads as "the audit failed".
      #
      # `cargo audit` reads Cargo.lock only, so no system libraries and no workspace build.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      # Not `--deny warnings`. That promotes `unmaintained` notices to failures, and this
      # tree has fourteen of them — all from the Tauri desktop app's Linux backend, none a
      # vulnerability, each already ignored in deny.toml with a written reason and a check
      # that it is unreachable from the vault core.
      #
      # cargo-audit cannot read deny.toml, so `--deny warnings` here would mean maintaining
      # the same exemption list in two files that cannot be kept in step. Instead this blocks
      # on the things that are unambiguously problems — vulnerabilities are denied by default —
      # and unmaintained and unsound findings stay the responsibility of the one config that
      # documents why each is tolerated — deny.toml, where `cargo deny check advisories` reads
      # them, in both this workflow and ci.yml.
      - name: Audit dependencies
        run: cargo audit

  deny:
    name: cargo-deny (all checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Not the container action: it runs in a musl image that reads this repository's
      # `rust-toolchain.toml`, lacks the pinned toolchain, and fails before checking anything.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Bans, licenses, and sources
        run: cargo deny check bans licenses sources
      # Separate, because this one depends on the upstream RustSec database being parseable and
      # that is outside this repository's control. See ci.yml for the same split.
      - name: Advisories
        run: cargo deny check advisories

  # Unused dependencies are not just clutter here: every crate in the tree is code
  # that can run inside the process holding an unlocked vault, so removing one is a
  # real reduction in attack surface.
  unused:
    name: Unused dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # See ci.yml: the desktop app is a workspace member, so a workspace-wide command on
      # Linux needs the GTK and WebKit headers.
      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libglib2.0-dev
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly udeps --workspace --all-targets
