name: Supply chain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Blocks a pull request that introduces a vulnerable dependency, and enforces the licence
  # policy at review time rather than at `cargo deny` time.
  #
  # This is the earliest point the licence rule can be applied. deny.toml already rejects
  # incompatible licences, but only once the dependency is in Cargo.lock and someone runs
  # the job; this refuses the change with the reason attached to the diff that caused it.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by comment-summary-in-pr; without it the action warns and drops the summary.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
          # A denylist, not an allowlist.
          #
          # An allowlist mirroring deny.toml was the obvious thing and it fails immediately:
          # this check covers every ecosystem in the diff, including GitHub Actions, and
          # actions carry no licence metadata in the dependency graph. Their licence resolves
          # to unknown, unknown is not on the allowlist, and the run fails with "detected
          # incompatible licenses" over actions this repository already pins by SHA.
          #
          # So the licence allowlist stays in deny.toml, which is Rust-only and authoritative,
          # and this lists only what genuinely cannot be combined into an AGPL work. The value
          # here is fail-on-severity: catching a vulnerable dependency in the diff that
          # introduced it, rather than on the next nightly audit.
          deny-licenses: >-
            GPL-2.0-only, LGPL-2.0-only, SSPL-1.0, BUSL-1.1,
            Elastic-2.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0

  # ---------------------------------------------------------------------------
  # Snyk. Free for open source, but it needs an account and a repository token.
  #
  # It overlaps cargo-audit and cargo-deny, which already read the RustSec advisory database
  # and run on every push and nightly. Kept because the databases are not identical, and
  # skipped cleanly rather than failing when the token is absent — which is the case on
  # every fork, and on this repository until someone configures it.
  # ---------------------------------------------------------------------------
  snyk:
    name: Snyk
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is a token configured?
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "${SNYK_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNYK_TOKEN is not set; skipping. Add the secret to enable this."
          fi

      - if: steps.token.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.93.1

      - name: Scan
        if: steps.token.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # The CLI via npx rather than snyk/actions: one fewer third-party action with access
        # to this repository, for a tool that is already a third party.
        run: npx --yes snyk@latest test --all-projects --severity-threshold=medium
