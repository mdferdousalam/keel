name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Any job needing more escalates locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI while keeping local builds pleasant.
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      # All third-party actions are pinned to a full commit SHA, never a tag.
      # A tag can be moved; a SHA cannot. Dependabot proposes updates, which are
      # reviewed like any other dependency change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The desktop app is a workspace member, so `cargo build --workspace` on Linux needs
      # the GTK and WebKit development headers. Nothing else in the tree needs them — the
      # vault core, the agent, and the CLI are all free of system dependencies — but a
      # workspace build does not get to pick and choose. Keeping the app a member is
      # deliberate: it is what lets `cargo xtask check-layering` verify that the GUI cannot
      # reach the cryptographic core.
      - name: Install GTK and WebKit (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libglib2.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # The minimum supported Rust version, which was a claim and not a fact.
  #
  # Cargo.toml declares rust-version = "1.89" and every other job in this file builds 1.93.1,
  # so nothing verified it. It happened to be true when this job was written, which is luck:
  # any use of a newer standard-library API would have shipped a manifest that promises to
  # build on a compiler it cannot build on, and the first person to hit it would be a user
  # on an older toolchain reading a confusing error.
  #
  # `check --all-targets` rather than `test`: MSRV is about whether the code compiles, and
  # running the suite twice per push buys nothing.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          # Taken from the manifest rather than written here, so the two cannot disagree.
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          test -n "$version" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: ${version}"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libglib2.0-dev
      # rust-toolchain.toml pins 1.93.1, so the MSRV toolchain has to be requested explicitly.
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported platforms on every pull request. The vault format and the
        # atomic-write path have real platform differences — directory fsync, rename
        # semantics, path handling — so testing only Linux would miss exactly the bugs
        # that corrupt someone's vault. Linux caught one in this very file's history: a
        # stale-socket check that deleted regular files, because `connect` to a
        # non-socket returns ECONNREFUSED there and something else on macOS.
        #
        # windows-2022 is back, and it is a *compile* check rather than a claim of support.
        # Bitting does not run on Windows — the agent has no named-pipe transport, and
        # `docs/architecture.md` specifies what has to be built. What this job is for is
        # keeping the portable code healthy so that work is not preceded by clearing a
        # pile of accumulated breakage. Most integration tests are `#![cfg(unix)]` and
        # compile to nothing there, which is expected.
        #
        # It was removed for one commit because `bitting-hardening` imported windows-sys
        # symbols from the wrong modules. Those were corrected against the crate source;
        # this job is how that correction gets verified, since none of it can be compiled
        # on the machine Bitting is developed on.
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The desktop app is a workspace member, so `cargo build --workspace` on Linux needs
      # the GTK and WebKit development headers. Nothing else in the tree needs them — the
      # vault core, the agent, and the CLI are all free of system dependencies — but a
      # workspace build does not get to pick and choose. Keeping the app a member is
      # deliberate: it is what lets `cargo xtask check-layering` verify that the GUI cannot
      # reach the cryptographic core.
      - name: Install GTK and WebKit (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libglib2.0-dev
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  gates:
    name: Architectural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # These three checks enforce claims the project makes:
      #   - clients cannot link the cryptographic core
      #   - no HTTP/TLS stack is reachable from the vault core
      #   - the licence boundary holds: every file states its terms, and no copyleft crate
      #     sits underneath the two crates published as embeddable
      # A claim enforced only by discipline is not enforced.
      # The desktop app is a workspace member, so `cargo build --workspace` on Linux needs
      # the GTK and WebKit development headers. Nothing else in the tree needs them — the
      # vault core, the agent, and the CLI are all free of system dependencies — but a
      # workspace build does not get to pick and choose. Keeping the app a member is
      # deliberate: it is what lets `cargo xtask check-layering` verify that the GUI cannot
      # reach the cryptographic core.
      - name: Install GTK and WebKit (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libglib2.0-dev
      - name: Dependency layering
        run: cargo xtask check-layering
      - name: Network isolation
        run: cargo xtask check-network
      - name: Licence boundary
        run: cargo xtask check-licenses

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Installed rather than run through the container action. That action runs cargo-deny
      # inside a musl image, which reads this repository's `rust-toolchain.toml`, does not have
      # the pinned toolchain, and fails before checking anything:
      #
      #   override toolchain '1.93.1-x86_64-unknown-linux-musl' is not installed
      #
      # Running it on the same runner as everything else removes a whole class of
      # container-versus-repository mismatch.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      # `bans licenses sources` are checks about *our* choices: they are deterministic, they
      # answer only to this repository's deny.toml, and they must never be allowed to fail.
      - name: Bans, licenses, and sources
        run: cargo deny check bans licenses sources
      # Advisories depend on the upstream RustSec database, which can be transiently
      # unparseable through no fault of this repository — it was, on the first run here, with a
      # malformed RUSTSEC-2026-0109.md. Kept as its own step so an upstream problem is visible
      # and attributable rather than hidden, and so it cannot mask a real finding in the checks
      # above. `audit.yml` also runs cargo-audit daily, so a genuine advisory has a second path
      # to being noticed.
      - name: Advisories
        run: cargo deny check advisories

  # The vault format parser is the only code in the project that reads fully
  # attacker-controlled bytes, so a panic there is a denial-of-service bug rather
  # than a robustness nit. A short smoke run on every pull request catches
  # regressions; fuzz.yml runs the long sessions nightly.
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins 1.93.1, and a pin in the repository beats a toolchain the
    # action installed: the job requested nightly, got stable, and cargo-fuzz died with
    # "the option `Z` is only accepted on the nightly compiler". Setting this in the
    # environment is what actually overrides the file.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Skip if no fuzz targets yet
        id: check
        run: |
          if [ -d fuzz/fuzz_targets ] && [ -n "$(ls -A fuzz/fuzz_targets 2>/dev/null)" ]; then
            echo "have_targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_targets=false" >> "$GITHUB_OUTPUT"
            echo "No fuzz targets present yet; skipping."
          fi
      - name: Install cargo-fuzz
        if: steps.check.outputs.have_targets == 'true'
        run: cargo install cargo-fuzz --locked
      - name: Run each target briefly
        if: steps.check.outputs.have_targets == 'true'
        run: |
          for target in fuzz/fuzz_targets/*.rs; do
            name="$(basename "$target" .rs)"
            echo "::group::fuzz $name"
            cargo fuzz run "$name" -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  # A single required check for branch protection, so adding a job above does not
  # mean editing the protection rules.
  # ---------------------------------------------------------------------------
  # Line coverage. Advisory, and deliberately without a threshold.
  #
  # A coverage percentage is a weak proxy for whether the tests assert anything — this
  # repository's own crash test passed for a while by parsing the wrong bytes. It is useful
  # as a map of what is untested, not as a number to defend, so no gate is attached to it.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libglib2.0-dev
      - run: cargo install cargo-llvm-cov --locked
      - name: Measure
        # Library unit tests only, and only the crates where a coverage number means
        # something.
        #
        # `--workspace` fails outright: the CLI and MCP end-to-end tests exec the real
        # `bitting` binary and spawn an agent, and cargo-llvm-cov redirects the target
        # directory for instrumentation, so the fixture looks for a binary that is not where
        # it expects. Every one of those tests failed for that reason and none of them for a
        # reason about the code. They are covered properly by the `test` job above, on all
        # three operating systems, uninstrumented.
        #
        # What is left is the vault core — crypto, format, storage, policy — which is where
        # an untested branch actually matters.
        run: |
          cargo llvm-cov --locked --lib --lcov --output-path lcov.info \
            -p bitting-crypto \
            -p bitting-format \
            -p bitting-store \
            -p bitting-core \
            -p bitting-proto \
            -p bitting-import
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # Public repositories can upload without a token. If Codecov later requires one,
          # the artifact below still carries the report.
          fail_ci_if_error: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  ci-success:
    name: CI
    if: always()
    # `coverage` is deliberately absent: it is advisory, and a flaky upload must not be able
    # to block a merge. `msrv` is present — a broken MSRV is a broken promise in the manifest.
    needs: [lint, msrv, test, gates, deny, fuzz-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed."
          exit 1
      - run: echo "All CI jobs passed."
