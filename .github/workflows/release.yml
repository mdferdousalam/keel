name: Release

# The trust model this workflow implements:
#
#   A compromise of this repository or of GitHub Actions must not be able to produce a
#   release that users accept.
#
# So the signing keys never enter CI. This workflow builds artifacts, computes checksums,
# and requests Sigstore-backed build provenance — all of which a compromised pipeline could
# also do. What it cannot do is sign SHA256SUMS with the maintainer's offline Ed25519 and
# ML-DSA keys. `bitting verify-release` requires both of those signatures, so an attacker who
# owns this pipeline produces an *unsigned* release that the verifier rejects.
#
# The release is therefore published as a **draft**. A human downloads the artifacts, signs
# the checksum manifest on an offline machine, uploads the two signatures, and publishes.
# That manual step is not friction to be optimised away; it is the entire security property.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Gate: never build a release that would not pass CI.
  # ---------------------------------------------------------------------------
  verify:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      # The desktop app is a workspace member, so workspace-wide commands on Linux need the
      # GTK and WebKit headers. See ci.yml.
      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libglib2.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Link the binaries before testing. Not redundant with `cargo test`.
      #
      # `cargo test --workspace` does not build every bin in the workspace. It builds a
      # package's bin when that package has integration tests that might exec it, and
      # `bitting-agent` is the one shipped crate with no `tests/` directory — so its library
      # gets built for dependents and its executable never gets linked.
      #
      # The CLI end-to-end tests in `bitting-cli/tests/e2e.rs` spawn that executable by path.
      # Without this step every one of them fails with "could not start the agent at
      # target/debug/bitting-agent", which is what the first run of this workflow did.
      #
      # Verified by reproducing it in a clean target directory: after
      # `cargo test --workspace --no-run`, the directory holds bitting, bitting-mcp,
      # bitting-native-host and bitting-desktop — every crate that has a tests/ directory —
      # and no bitting-agent. `cargo build --workspace` produces it.
      #
      # ci.yml's test job has had this same step all along, which is exactly why CI stayed
      # green while this workflow could not have completed. The two now match.
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # The architectural gates are release blockers, not advisory.
      - run: cargo xtask check

  # ---------------------------------------------------------------------------
  # Build. Every flag here exists to make the output depend only on the source.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl: statically linked and the most reproducible artifact in the set. This is
          # the target the rebuild workflow compares against.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            reproducible: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            reproducible: true
          - target: aarch64-apple-darwin
            os: macos-14
            reproducible: false
          - target: x86_64-apple-darwin
            os: macos-14
            reproducible: false
          # The GNU toolchain is used for the reproducibility reference on Windows: MSVC
          # embeds timestamps and non-deterministic PDB signatures.
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            reproducible: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Record the source date
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # Every one of these removes a source of nondeterminism:
          #   SOURCE_DATE_EPOCH  - timestamps embedded by build tooling
          #   remap-path-prefix  - the absolute path of the build directory
          #   TZ / LC_ALL        - locale-dependent formatting
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/build
            --remap-path-prefix=${{ env.HOME }}/.cargo=/cargo
          TZ: UTC
          LC_ALL: C
          # blake3 compiles C, so cross-building needs a C toolchain for the target. Ubuntu
          # packages `musl-tools`, which provides musl-gcc for x86_64 only — there is no apt
          # package named aarch64-linux-musl-gcc, which is the tool cc-rs went looking for and
          # did not find on the first run of this workflow:
          #
          #   error occurred in cc-rs: failed to find tool "aarch64-linux-musl-gcc"
          #
          # These variables are target-scoped, so they are inert for every other entry in the
          # matrix. The aarch64 gnu cross-compiler acts as compiler and linker driver; the
          # musl libc itself still comes from the Rust target and is statically linked.
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          # Every binary the packaging in packaging/ installs. Building only bitting-cli and
          # bitting-agent shipped .deb and PKGBUILD files that referenced bitting-mcp and
          # bitting-native-host — packages that would have failed to build at install time.
          #
          # bitting-reveal is deliberately absent: it links a window toolkit, which does not
          # belong in a static musl binary, and the platforms where it works need a
          # dynamically linked build. It is packaged separately with the desktop app.
          cargo build --locked --profile release-repro --target ${{ matrix.target }} \
            -p bitting-cli -p bitting-agent -p bitting-mcp -p bitting-native-host

      # macOS: ad-hoc signing only. There is no paid Apple Developer ID, so the app cannot be
      # notarized. Ad-hoc signing is still mandatory, not optional: an unsigned arm64 binary
      # will not execute at all on Apple Silicon.
      #
      # The unsigned hash is published alongside, because `codesign` embeds a timestamp and so
      # a signed artifact is not reproducible. See docs/REPRODUCE.md.
      #
      # This MUST run before Package. It used to run after, which meant the archive was built
      # from unsigned binaries and only the discarded on-disk copies were ever signed — so the
      # published macOS tarball contained binaries that would not execute on Apple Silicon at
      # all. The signing step reported success throughout.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          bindir="target/${{ matrix.target }}/release-repro"
          # Same four binaries as the Package step below.
          for binary in bitting bitting-agent bitting-mcp bitting-native-host; do
            shasum -a 256 "${bindir}/${binary}" \
              | sed "s|${bindir}/|unsigned:|" >> dist/UNSIGNED-HASHES
            codesign --force --sign - --options runtime "${bindir}/${binary}"
          done
          # Prove it took, rather than trusting that codesign exited 0.
          for binary in bitting bitting-agent bitting-mcp bitting-native-host; do
            codesign --verify --strict "${bindir}/${binary}"
          done

      - name: Package
        id: package
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          version="${GITHUB_REF_NAME#v}"
          outdir="dist"
          mkdir -p "$outdir"
          bindir="target/${target}/release-repro"

          # Every binary the build step compiles, and the same set packaging/nfpm.yaml and
          # packaging/PKGBUILD install. These had drifted: the build was corrected to produce
          # all four but the archive still carried only `bitting` and `bitting-agent`, so the
          # published tarball was missing two of the binaries the packages reference. That is
          # the same failure the comment on the build step describes, one step further down
          # the pipeline. Keep this list, the `cargo build -p` list, and the signing loop below
          # in agreement.
          binaries=(bitting bitting-agent bitting-mcp bitting-native-host)

          if [[ "$target" == *windows* ]]; then
            name="bitting-${version}-${target}.zip"
            exes=("${binaries[@]/%/.exe}")
            (cd "$bindir" && zip -X -q "../../../${outdir}/${name}" "${exes[@]}")
          elif [[ "$target" == *darwin* ]]; then
            name="bitting-${version}-${target}.tar.gz"
            # Plain BSD tar. macOS does not ship GNU tar, and the deterministic flags used
            # below are GNU-only — the first run of this workflow died here on
            # "tar: Option --sort=name is not supported".
            #
            # Nothing is lost by omitting them. Those flags exist to make the archive
            # byte-identical between builds, and the darwin targets are already marked
            # `reproducible: false` in the matrix because `codesign` embeds a timestamp. An
            # archive of non-reproducible binaries cannot be reproducible, so pinning its
            # metadata would buy a property the contents cannot have. Installing gnu-tar to
            # apply them would be ceremony.
            tar -czf "${outdir}/${name}" -C "$bindir" "${binaries[@]}"
          else
            name="bitting-${version}-${target}.tar.gz"
            # Fixed ownership, sorted names, and a pinned mtime: tar metadata is otherwise a
            # rich source of build-to-build differences. GNU tar only, which is what the
            # Linux and Windows-cross runners have — see the darwin branch above.
            tar --sort=name \
                --owner=0 --group=0 --numeric-owner \
                --mtime="@${SOURCE_DATE_EPOCH:-0}" \
                -czf "${outdir}/${name}" \
                -C "$bindir" "${binaries[@]}"
          fi
          echo "artifact=${name}" >> "$GITHUB_OUTPUT"
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # A single macOS download that works on both architectures.
  #
  # packaging/homebrew-bitting.rb has always referenced
  # `bitting-<version>-macos-universal.tar.gz`, and nothing ever produced it — the build
  # emits one tarball per architecture. `brew install` would have failed on a 404 the first
  # time anyone tried it.
  #
  # No reproducibility is given up here: both darwin targets are already
  # `reproducible: false`, because `codesign` embeds a timestamp.
  # ---------------------------------------------------------------------------
  universal-macos:
    name: macOS universal binary
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*-apple-darwin
          path: arch
          merge-multiple: false

      - name: lipo the two architectures together
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p universal dist

          arm=$(mktemp -d); intel=$(mktemp -d)
          tar xzf "arch/dist-aarch64-apple-darwin/bitting-${version}-aarch64-apple-darwin.tar.gz" -C "$arm"
          tar xzf "arch/dist-x86_64-apple-darwin/bitting-${version}-x86_64-apple-darwin.tar.gz" -C "$intel"

          for binary in bitting bitting-agent bitting-mcp bitting-native-host; do
            lipo -create "${arm}/${binary}" "${intel}/${binary}" -output "universal/${binary}"
            # lipo strips the ad-hoc signatures, so re-sign the merged binary. Without this
            # the universal build is the one artifact on the release that cannot run on
            # Apple Silicon.
            codesign --force --sign - --options runtime "universal/${binary}"
            codesign --verify --strict "universal/${binary}"
            lipo -info "universal/${binary}"
          done

          tar --sort=name --owner=0 --group=0 --numeric-owner \
              -czf "dist/bitting-${version}-macos-universal.tar.gz" \
              -C universal bitting bitting-agent bitting-mcp bitting-native-host

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos-universal
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # .deb and .rpm.
  #
  # packaging/nfpm.yaml has been complete and correct for a while and was never executed by
  # anything, so no Linux package has ever been produced. nfpm reads the binaries from
  # ./target/release, so the musl artifacts are unpacked to that path per architecture.
  # ---------------------------------------------------------------------------
  linux-packages:
    name: Linux packages (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.target }}
          path: incoming

      - name: Install nfpm
        run: |
          set -euo pipefail
          nfpm_version=2.43.1
          base="https://github.com/goreleaser/nfpm/releases/download/v${nfpm_version}"
          # Kept under the asset's own name: `sha256sum -c` opens the path recorded in the
          # manifest, so saving to nfpm.tar.gz makes it look for a file that is not there and
          # fail with "FAILED open or read" — which looks like a checksum mismatch and is not.
          archive="nfpm_${nfpm_version}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$archive" "${base}/${archive}"
          # Verified against the release's own published checksums file rather than a hash
          # copied in here, so bumping the version does not mean hand-editing a digest — the
          # usual way a pinned hash quietly becomes a lie.
          curl -fsSL -o nfpm_checksums.txt "${base}/checksums.txt"
          grep " ${archive}\$" nfpm_checksums.txt | sha256sum -c -
          tar xzf "$archive" nfpm
          sudo install -m0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build the packages
        env:
          BITTING_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Package managers do not accept the tag verbatim. The leading `v` is not part of a
          # version, and RPM forbids `-` in the Version field outright, so a pre-release tag
          # like v0.1.0-rc.1 fails the rpm build. Both deb and rpm read `~` as "sorts before
          # the release", which is exactly what a release candidate should do.
          export BITTING_VERSION="${version//-/\~}"
          echo "tag=${GITHUB_REF_NAME}  package version=${BITTING_VERSION}"

          # nfpm.yaml reads binaries from ./target/release.
          mkdir -p target/release dist
          tar xzf "incoming/bitting-${version}-${{ matrix.target }}.tar.gz" -C target/release
          for binary in bitting bitting-agent bitting-mcp bitting-native-host; do
            test -x "target/release/${binary}" \
              || { echo "::error::${binary} missing from the release tarball"; exit 1; }
          done
          for format in deb rpm; do
            nfpm package --config packaging/nfpm.yaml --packager "$format" --target dist/
          done
          ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Reproducibility check: build the deterministic targets twice, in independent
  # jobs, and require the hashes to match.
  #
  # Claiming reproducibility without testing it is how projects discover, from a
  # user, that their builds have not been reproducible for a year.
  # ---------------------------------------------------------------------------
  reproducibility:
    name: Double-build check
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=/build
            --remap-path-prefix=${{ env.HOME }}/.cargo=/cargo
          TZ: UTC
          LC_ALL: C
        run: |
          # All four shipped binaries, matching the build job. This checked only `bitting`
          # and `bitting-agent`, so bitting-mcp and bitting-native-host were published with
          # their reproducibility never actually verified — the same list drifting apart that
          # left them out of the archive and out of rebuild.yml.
          cargo build --locked --profile release-repro \
            --target x86_64-unknown-linux-musl \
            -p bitting-cli -p bitting-agent -p bitting-mcp -p bitting-native-host
      - name: Hash
        run: |
          bindir=target/x86_64-unknown-linux-musl/release-repro
          sha256sum "$bindir/bitting" \
                    "$bindir/bitting-agent" \
                    "$bindir/bitting-mcp" \
                    "$bindir/bitting-native-host" \
            | sed 's|target/.*/||' > hashes-${{ matrix.attempt }}.txt
          cat hashes-${{ matrix.attempt }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-hashes-${{ matrix.attempt }}
          path: hashes-${{ matrix.attempt }}.txt

  compare-builds:
    name: Compare the two builds
    needs: reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repro-hashes-*
          merge-multiple: false
      - name: Require identical output
        run: |
          set -euo pipefail
          if diff -u repro-hashes-1/hashes-1.txt repro-hashes-2/hashes-2.txt; then
            echo "Reproducible: two independent builds produced identical binaries."
          else
            echo "::error::Two builds of the same source produced different binaries."
            echo "The reproducibility claim in docs/REPRODUCE.md is not currently true."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Publish a DRAFT. Signing happens offline; see the header comment.
  # ---------------------------------------------------------------------------
  draft:
    name: Draft release
    needs: [build, universal-macos, linux-packages, compare-builds]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Sigstore-backed provenance. Supplementary evidence, not the trust root: a compromised
      # pipeline can also produce this. Its value is that it lands in a public transparency
      # log, so a targeted backdoor cannot reach one user without a public record.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: staging
          merge-multiple: true

      # Windows is built — it proves the code compiles there, and it is the reproducibility
      # reference target — but it is not published. The agent has no named-pipe transport, so
      # `Transport::bind` returns Unsupported and every command fails at the transport layer:
      # a Windows package would install a binary where even `bitting init` cannot work.
      # Shipping it would be a claim the code does not support. Remove this step, and the
      # note in the release body, once the transport lands.
      - name: Withhold the Windows artifact
        run: |
          set -euo pipefail
          removed=$(find staging -maxdepth 1 -name '*windows*' -print -delete | wc -l)
          echo "withheld ${removed} Windows artifact(s) — see the comment above this step"

      - name: Build the checksum manifest
        run: |
          set -euo pipefail
          cd staging
          # Sorted, so the manifest is itself deterministic and a diff between releases is
          # readable.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "staging/*"

      - name: Generate an SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          find . -name '*.cdx.json' -exec cp {} staging/ \;

      - name: Publish as a draft awaiting offline signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > NOTES.md <<'EOF'
          ## Verifying this release

          This release is **not yet signed** and should not be trusted until it is.

          Bitting requires two signatures over `SHA256SUMS`, made with keys that never enter
          CI: `SHA256SUMS.minisig` (Ed25519) and `SHA256SUMS.mldsa.sig` (ML-DSA-65). Once
          both are attached:

              bitting verify-release ./downloaded-release/

          Both signatures must pass. See `docs/VERIFY.md`.

          ## Notes on platform trust

          Bitting is distributed without paid code-signing certificates, so macOS and Windows
          will warn about downloaded installers. Install via Homebrew, Scoop, or your Linux
          package manager to avoid that, and see `docs/install.md` for why reproducible
          builds plus offline signatures are a stronger integrity guarantee than a purchased
          certificate.

          Linux `musl` artifacts are byte-for-byte reproducible; anyone can rebuild them and
          compare. macOS artifacts are not, because `codesign` embeds a timestamp — the hash
          of the unsigned binary is published in `UNSIGNED-HASHES` instead. See
          `docs/REPRODUCE.md`.
          EOF

          gh release create "$TAG" \
            --draft \
            --title "Bitting $TAG" \
            --notes-file NOTES.md \
            staging/*

          echo "::notice::Draft created. Sign SHA256SUMS offline, attach both signatures, then publish."
