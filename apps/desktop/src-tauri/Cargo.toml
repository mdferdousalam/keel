[package]
name = "bitting-desktop"
description = "Bitting desktop application: a masked-only shell over the Bitting agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Shipped as an application bundle by tauri, never as a crate.
publish = false

[lints]
workspace = true

[[bin]]
name = "bitting-desktop"
path = "src/main.rs"

[lib]
name = "bitting_desktop"
path = "src/lib.rs"

# Note what is absent: bitting-crypto, bitting-format, bitting-core, bitting-store. The desktop shell
# is a client like any other, and `cargo xtask check-layering` fails the build if that
# changes. It cannot decrypt anything, and the webview it hosts is further from the keys
# than the shell is.
[dependencies]
bitting-client = { workspace = true }
bitting-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
# The GUI-invariant test drives a real agent, so it needs a real client and a temp dir.
bitting-client = { workspace = true }
tempfile = { workspace = true }
