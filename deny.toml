# cargo-deny configuration.
#
# This file is a security control, not bookkeeping. It enforces three of the
# supply-chain rules from docs/threat-model.md:
#   1. No known-vulnerable or unmaintained dependencies.
#   2. No dependency may introduce a TLS/HTTP stack into the vault core
#      (see the `keel-core` network gate in xtask and CI).
#   3. Every dependency comes from crates.io — never a git URL, never a
#      private registry.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Add entries only with a written justification and an owner, e.g.:
    # { id = "RUSTSEC-0000-0000", reason = "...", expires = "2026-12-31" }
]

[licenses]
version = 2
# GPL-3.0-or-later project. Permissive licenses can be combined into a GPLv3
# work; copyleft-incompatible or unknown licenses cannot.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "GPL-3.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A build script that can reach the network can do anything at build time.
# There is no allowlist here on purpose: if a dependency needs one, that is a
# conversation, not a config change.
deny = [
    # TLS / HTTP stacks. Only keel-breach (opt-in, off by default) may use
    # rustls + ureq; those are allow-listed per-crate below via `skip`.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "curl" },
    { name = "curl-sys" },
    # Superseded by `getrandom`/`rustix`; pulling these in is usually a mistake.
    { name = "time", version = "<0.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
