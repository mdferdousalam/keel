[package]
name = "keel-client"
description = "Keel client library: connect-or-spawn the agent. Holds no key material."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Deliberately does NOT depend on keel-crypto, keel-format, or keel-core. That absence
# is enforced by `cargo xtask check-layering` and is what keeps key material out of the
# CLI, the MCP server, the native messaging host, and the desktop shell.
[dependencies]
keel-proto = { workspace = true }
thiserror = { workspace = true }
