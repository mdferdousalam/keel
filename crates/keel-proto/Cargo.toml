[package]
name = "keel-proto"
description = "Keel IPC wire types. Serde only; no logic, no crypto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Apache-2.0, not the workspace's AGPL. This crate is the protocol definition and nothing
# else — serde types with no logic and no crypto — so there is nothing here worth protecting
# with copyleft, and anything that speaks to the agent needs it. Apache rather than MIT for
# the express patent grant and the retaliation clause; a bare MIT gives away the patent
# position for free. `cargo xtask check-licenses` verifies this crate's internal dependency
# closure stays empty, which is what keeps the permissive surface honest.
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
