[package]
name = "bitting-client"
description = "Bitting client library: connect-or-spawn the agent. Holds no key material."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# MPL-2.0, not the workspace's AGPL. This is the crate a third-party application embeds, and
# no copyleft license permits that. MPL is the narrowest thing that does: its copyleft is
# per-file, so a closed application may link this crate, but any improvement to *these* files
# comes back. The layering rule in `xtask/src/rules.rs` is what makes that safe — this crate
# may depend only on bitting-proto, never on bitting-crypto, bitting-format, or bitting-core, so the
# permissive surface provably contains no key material, no crypto, and no vault format.
license = "MPL-2.0"
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Deliberately does NOT depend on bitting-crypto, bitting-format, or bitting-core. That absence
# is enforced by `cargo xtask check-layering` and is what keeps key material out of the
# CLI, the MCP server, the native messaging host, and the desktop shell.
[dependencies]
bitting-proto = { workspace = true }
thiserror = { workspace = true }
