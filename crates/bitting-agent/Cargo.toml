[package]
name = "bitting-agent"
description = "Bitting agent daemon: the only process that holds unlocked vault keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "bitting-agent"
path = "src/main.rs"

[lib]
name = "bitting_agent"
path = "src/lib.rs"

# No async runtime. This process holds the unlocked vault, so its dependency list is
# the one that matters most: a local IPC server serving a handful of clients is served
# perfectly well by a thread per connection, and dropping tokio removes a very large
# amount of code from the address space that contains the master key.
[dependencies]
arboard = { workspace = true }
blake3 = { workspace = true }
bitting-core = { workspace = true }
bitting-crypto = { workspace = true }
bitting-format = { workspace = true }
bitting-hardening = { workspace = true }
bitting-proto = { workspace = true }
bitting-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
