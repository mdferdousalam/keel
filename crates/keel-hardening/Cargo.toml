[package]
name = "keel-hardening"
description = "Process hardening for Keel: page locking, core-dump suppression, anti-debug, panic wipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# NOTE: this is the ONLY crate in the workspace that may use `unsafe`. It exists
# so that every raw platform call in the project lives behind one auditable
# boundary. The workspace lint table forbids unsafe everywhere else.
[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"

[dependencies]
# For `exclude_window_from_capture`. A handle type carrying a lifetime is what lets that
# function be safe: the borrow proves the window is alive, so no precondition is left for a
# caller to get wrong.
raw-window-handle = "0.6"
keel-crypto = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Every module a symbol is actually imported from needs its feature enabled, and the symbols
# are spread wider than the original list assumed:
#   Threading           SetProcessMitigationPolicy and the policy discriminants
#   SystemServices      the PROCESS_MITIGATION_* structs those calls take
#   ErrorReporting      WerRegisterExcludedMemoryBlock
#   SystemInformation   GetSystemInfo / SYSTEM_INFO, for the page size
# `Diagnostics_Debug` is gone: nothing is imported from it. Each location was checked against
# the windows-sys source rather than guessed, because this cannot be compiled here.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_ErrorReporting",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Only for the screen-capture exclusion in `platform`. The reveal overlay cannot make this
# call itself: it needs `unsafe`, and `unsafe` lives here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWindow",
    "NSView",
    "NSResponder",
] }

[dev-dependencies]
tempfile = { workspace = true }
