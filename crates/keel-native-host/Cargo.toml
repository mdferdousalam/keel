[package]
name = "keel-native-host"
description = "Keel browser native-messaging host. A dumb pipe to the agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "keel-native-host"
path = "src/main.rs"

[lib]
name = "keel_native_host"
path = "src/lib.rs"

# Note what is absent: keel-crypto, keel-core, keel-format, keel-store. This process is
# launched by the browser and is the component closest to hostile input, so it is the one
# that knows the least. `cargo xtask check-layering` fails the build if that changes.
[dependencies]
keel-client = { workspace = true }
keel-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
