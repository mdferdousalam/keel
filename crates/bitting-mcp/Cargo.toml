[package]
name = "bitting-mcp"
description = "Bitting MCP server: exposes scoped vault operations to AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "bitting-mcp"
path = "src/main.rs"

[lib]
name = "bitting_mcp"
path = "src/lib.rs"

# The MCP stdio transport is newline-delimited JSON-RPC 2.0, which is implemented directly
# here rather than via the official `rmcp` SDK.
#
# That is a deliberate application of the dependency budget in CONTRIBUTING.md. `rmcp` is
# async, so taking it would pull tokio and its dependency tree into a password manager to
# do something that fits in a few hundred lines of synchronous code. The rule asks for a
# justification to add a dependency near the core, and there is not one here.
#
# The trade is real and worth naming: this code has to track the MCP specification by hand,
# where the SDK would track it for us. The protocol surface used (initialize, tools/list,
# tools/call) is small and stable, and `protocol.rs` documents the revision it targets.
[dependencies]
bitting-client = { workspace = true }
bitting-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
