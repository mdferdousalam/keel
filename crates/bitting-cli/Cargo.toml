[package]
name = "bitting-cli"
description = "Bitting command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "bitting"
path = "src/main.rs"

[dependencies]
bitting-client = { workspace = true }
bitting-import = { workspace = true }
bitting-proto = { workspace = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
rpassword = "7"
serde_json = { workspace = true }
# Release verification. Deliberately verify-only crates: this binary must be able to check
# a signature and must never be able to produce one, since the signing keys live offline.
minisign-verify = "0.2"
fips204 = "0.4"
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
