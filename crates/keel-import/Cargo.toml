[package]
name = "keel-import"
description = "Browser and CSV password importers for Keel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Deliberately depends on no other Keel crate. An importer parses hostile files and produces
# plain data; giving it access to the vault format or the cryptographic core would put file
# parsing next to key handling for no benefit.
[dependencies]
csv = "1"
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
