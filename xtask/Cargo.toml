[package]
name = "xtask"
description = "Keel repository automation: layering checks, manifest generation, packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# xtask is a developer tool that never ships, so its dependencies are outside the
# vault's trust boundary and outside the dependency budget that applies to
# keel-core. It still may not use `unsafe`.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
