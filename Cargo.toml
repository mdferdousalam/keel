[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/bitting-crypto",
    "crates/bitting-format",
    "crates/bitting-hardening",
    "crates/bitting-store",
    "crates/bitting-core",
    "crates/bitting-proto",
    "crates/bitting-agent",
    "crates/bitting-client",
    "crates/bitting-reveal",
    "crates/bitting-cli",
    "crates/bitting-mcp",
    "crates/bitting-native-host",
    "crates/bitting-import",
    "crates/bitting-breach",
    "xtask",
]
# apps/desktop (Tauri) keeps its own workspace; it is added in Phase 4.
exclude = ["apps/desktop", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
# AGPL rather than GPL because the network clause is the whole point: GPLv3 does not
# reach someone who runs Bitting as a hosted service, and a sync service is the obvious
# thing to run. Two crates deliberately opt out of this default — see the `license`
# overrides in bitting-proto (Apache-2.0) and bitting-client (MPL-2.0), and the reasoning in
# `docs/architecture.md`. `cargo xtask check-licenses` enforces that the exceptions
# stay exceptions.
license = "AGPL-3.0-or-later"
repository = "https://github.com/mdferdousalam/bitting"
homepage = "https://github.com/mdferdousalam/bitting"
# The named holder is load-bearing, not courtesy: copyleft you cannot attribute is
# copyleft you cannot enforce. See `COPYRIGHT`.
authors = ["Md Ferdous Alam <mdferdousalam1989@yahoo.com>", "Bitting contributors"]

# ---------------------------------------------------------------------------
# Shared dependency versions.
#
# The crypto stack is deliberately pinned to the mature `digest 0.10` /
# `aead 0.5` RustCrypto generation. The newer 0.11/0.13 line is stable for
# some crates but `argon2` there is still a release candidate, and mixing the
# two generations would fork the dependency tree. One coherent, fully released
# generation is worth more than the newest version numbers.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- internal crates ---
# Declared here with both a path and a version so each member can say
# `bitting-crypto = { workspace = true }` and the versions stay in one place.
#
# The version is not decoration. A path dependency without one cannot be published, and
# `cargo install bitting-cli` is a stated distribution channel — cargo-deny catches this as a
# wildcard dependency, which is what it is: a build that resolves to whatever is there.
bitting-crypto = { path = "crates/bitting-crypto", version = "0.1.0" }
bitting-format = { path = "crates/bitting-format", version = "0.1.0" }
bitting-hardening = { path = "crates/bitting-hardening", version = "0.1.0" }
bitting-store = { path = "crates/bitting-store", version = "0.1.0" }
bitting-core = { path = "crates/bitting-core", version = "0.1.0" }
bitting-proto = { path = "crates/bitting-proto", version = "0.1.0" }
bitting-agent = { path = "crates/bitting-agent", version = "0.1.0" }
bitting-client = { path = "crates/bitting-client", version = "0.1.0" }
bitting-import = { path = "crates/bitting-import", version = "0.1.0" }
bitting-breach = { path = "crates/bitting-breach", version = "0.1.0" }

# --- crypto primitives ---
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
# XChaCha20Poly1305 is unconditional in 0.10; nonces come from `getrandom`
# directly rather than the crate's helper, so its RNG feature stays off.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
blake3 = "1.8"
subtle = "2.6"
getrandom = "0.4"

# --- secret handling ---
zeroize = { version = "1.8", features = ["derive", "alloc"] }
secrecy = "0.10.3"

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["alloc"] }

# --- errors / utility ---
thiserror = "2"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# --- desktop shell ---
# Only `apps/desktop/src-tauri` may use these. The GUI is a large dependency tree by
# necessity — a webview is a browser — which is exactly why it is kept on the far side of
# the client boundary from anything that touches a key.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6"] }
tauri-build = { version = "2", default-features = false }

# --- platform ---
# Clipboard. Only the agent gets this: a secret on the clipboard is placed there by the
# process that already holds it decrypted, so no other process needs the capability.
arboard = { version = "3", default-features = false }
libc = "0.2"
rustix = { version = "1", features = ["mm", "process", "fs"] }
windows-sys = "0.61"

# --- fs ---
tempfile = "3"
directories = "6"

# --- dev / test ---
proptest = "1"
hex-literal = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# Groups need a lower priority than the individual lints they contain, otherwise
# cargo cannot tell which setting wins. `unreachable_pub` is part of this group.
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# Correctness and panic-avoidance matter more here than ergonomics.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
integer_division = "warn"
cast_possible_truncation = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A fast death beats unwinding through buffers that hold key material.
# (Cargo forces -Cpanic=unwind for test targets, so `cargo test` is unaffected.)
panic = "abort"
strip = true
debug = false
overflow-checks = true

[profile.release-repro]
# Reproducible-build profile used by release CI. Identical to release; kept
# separate so build flags can diverge without touching local release builds.
inherits = "release"

[profile.dev]
# Catch arithmetic mistakes early in the crypto and format code.
overflow-checks = true
